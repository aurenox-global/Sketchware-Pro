name: Verification Baseline

on:
  pull_request:
    paths:
      - '.github/workflows/verification.yml'
      - 'scripts/check_lint_baseline_drift.sh'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - 'docs/dependency-snapshot.lock'
  push:
    branches-ignore:
      - 'wip/**'
    paths:
      - '.github/workflows/verification.yml'
      - 'scripts/check_lint_baseline_drift.sh'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - 'docs/dependency-snapshot.lock'
  workflow_dispatch:

jobs:
  verify:
    name: Compile + Lint + Smoke
    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Architectural fitness checks
        run: bash ./scripts/check_architecture_boundaries.sh

      - name: Set environmental variables
        shell: bash
        env:
          JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.JSON_CONTENT != '' }}
        run: |
          printf 'GOOGLE_SERVICES_JSON<<EOF\n%s\nEOF\n' "$JSON_CONTENT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Dependency snapshot lock check
        run: ./gradlew :app:verifyDependencySnapshot --no-daemon

      - name: Compile Java (debug)
        run: ./gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Lint baseline drift check
        run: bash ./scripts/check_lint_baseline_drift.sh

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt

      - name: Smoke build (debug APK)
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Smoke unit tests (debug)
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Compile instrumented tests (debug)
        run: ./gradlew :app:compileDebugAndroidTestJavaWithJavac --no-daemon

      - name: KMP smoke workflow (scaffold + compile + package)
        run: bash ./scripts/check_kmp_smoke_workflow.sh

      - name: KPI release gates
        run: bash ./scripts/check_kpi_release_gates.sh
