name: Android Instrumented Gate

on:
  pull_request:
    paths:
      - '.github/workflows/android-instrumented.yml'
      - 'app/**'
      - 'scripts/check_android_instrumented_gates.sh'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
  push:
    branches-ignore:
      - 'wip/**'
    paths:
      - '.github/workflows/android-instrumented.yml'
      - 'app/**'
      - 'scripts/check_android_instrumented_gates.sh'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
  workflow_dispatch:

jobs:
  instrumented-tests:
    name: Instrumented Tests (Emulator)
    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set environmental variables
        shell: bash
        env:
          JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.JSON_CONTENT != '' }}
        run: |
          printf 'GOOGLE_SERVICES_JSON<<EOF\n%s\nEOF\n' "$JSON_CONTENT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run connectedDebugAndroidTest on emulator
        id: instrumented
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          disable-snapshot: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Clasificar el fallo (infraestructura vs codigo)
        run: |
          if [ "${{ steps.instrumented.outcome }}" = "success" ]; then
            echo "Emulador arrancado y tests ejecutados."
            exit 0
          fi
          if compgen -G "app/build/outputs/androidTest-results/connected/**/*.xml" > /dev/null 2>&1; then
            echo "[FAIL] El emulador arranco y hay resultados de test: el fallo es del codigo."
            exit 1
          fi
          echo "[WARN] El emulador no llego a arrancar (imagen de sistema o adb): fallo de infraestructura."
          echo "No se marca el workflow en rojo. Reintenta el job desde la pestana Actions."
          exit 0

      - name: Enforce instrumented quality gates
        if: steps.instrumented.outcome == 'success'
        run: bash ./scripts/check_android_instrumented_gates.sh

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
