name: Android Instrumented Gate

on:
  pull_request:
    paths:
      - '.github/workflows/android-instrumented.yml'
      - 'app/**'
      - 'scripts/check_android_instrumented_gates.sh'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
  push:
    branches-ignore:
      - 'wip/**'
    paths:
      - '.github/workflows/android-instrumented.yml'
      - 'app/**'
      - 'scripts/check_android_instrumented_gates.sh'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
  workflow_dispatch:

jobs:
  instrumented-tests:
    name: Instrumented Tests (Emulator)
    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set environmental variables
        shell: bash
        env:
          JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.JSON_CONTENT != '' }}
        run: |
          printf 'GOOGLE_SERVICES_JSON<<EOF\n%s\nEOF\n' "$JSON_CONTENT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run connectedDebugAndroidTest on emulator
        id: instrumented
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          disable-snapshot: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            for attempt in 1 2; do
              if ./gradlew :app:connectedDebugAndroidTest --no-daemon; then exit 0; fi
              echo "== Intento $attempt fallido; reiniciando adb y reintentando =="
              adb kill-server || true
              adb start-server || true
              sleep 15
            done
            exit 1

      - name: Clasificar el fallo (infraestructura vs codigo)
        run: |
          if [ "${{ steps.instrumented.outcome }}" = "success" ]; then
            echo "Emulador arrancado y tests ejecutados."
            exit 0
          fi
          python3 - <<'PY'
          import glob, re, sys
          MIN = 5
          total = fails = 0
          for p in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              data = open(p, encoding='utf-8', errors='replace').read()
              m = re.search(r'<testsuite[^>]*tests="(\d+)"[^>]*failures="(\d+)"[^>]*errors="(\d+)"', data)
              if m:
                  total += int(m.group(1))
                  fails += int(m.group(2)) + int(m.group(3))
          print('Tests ejecutados: %d, fallos: %d' % (total, fails))
          if total < MIN:
              print('[WARN] Menos de %d tests ejecutados (el APK de test no se instalo o el emulador no respondio):' % MIN)
              print('       fallo de infraestructura; no se marca el workflow en rojo.')
              sys.exit(0)
          if fails:
              print('[FAIL] %d tests fallaron: el fallo es del codigo.' % fails)
              sys.exit(1)
          print('[WARN] Los tests corrieron y pasaron, pero la tarea fallo despues: se trata como infraestructura.')
          sys.exit(0)
          PY

      - name: Enforce instrumented quality gates
        if: steps.instrumented.outcome == 'success'
        run: bash ./scripts/check_android_instrumented_gates.sh

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
