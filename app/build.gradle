preBuild.dependsOn prepareAapt2NativeExecutables

def dependencySnapshotConfigurations = [
    "debugCompileClasspath",
    "debugRuntimeClasspath",
    "releaseRuntimeClasspath"
]

def buildDependencySnapshotText = {
  def lines = []

  dependencySnapshotConfigurations.each { configurationName ->
    def configuration = configurations.findByName(configurationName)
    if (configuration == null || !configuration.canBeResolved) {
      return
    }

    def dependencies = configuration.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
      def module = artifact.moduleVersion.id
      "${module.group}:${artifact.name}:${module.version}"
    }.unique().sort()

    lines << "[${configurationName}]"
    lines.addAll(dependencies)
    lines << ""
  }

  return lines.join(System.lineSeparator())
}

tasks.register('writeDependencySnapshot') {
  group = 'verification'
  description = 'Write resolved dependency snapshot lock file used for CI checks.'

  doLast {
    def snapshotFile = rootProject.file("docs/dependency-snapshot.lock")
    snapshotFile.parentFile.mkdirs()

    def snapshotText = buildDependencySnapshotText()
    snapshotFile.setText(snapshotText + System.lineSeparator(), 'UTF-8')
    println("Wrote dependency snapshot to ${snapshotFile}")
  }
}

tasks.register('verifyDependencySnapshot') {
  group = 'verification'
  description = 'Fail if dependency snapshot lock file is outdated.'

  doLast {
    def snapshotFile = rootProject.file("docs/dependency-snapshot.lock")
    if (!snapshotFile.exists()) {
      throw new GradleException("Missing dependency snapshot file at ${snapshotFile}. Run :app:writeDependencySnapshot first.")
    }

    def expectedText = snapshotFile.getText('UTF-8').replace("\r\n", "\n")
    def currentText = (buildDependencySnapshotText() + System.lineSeparator()).replace("\r\n", "\n")

    if (expectedText != currentText) {
      throw new GradleException("Dependency snapshot is outdated. Run ./gradlew :app:writeDependencySnapshot --no-daemon and commit docs/dependency-snapshot.lock")
    }

    println("Dependency snapshot is up to date.")
  }
}
