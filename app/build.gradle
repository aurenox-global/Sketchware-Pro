def secrets = System.getenv("GOOGLE_SERVICES_JSON")

apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"

def aapt2BinaryByAbi = [
  "arm64-v8a"  : "aapt2-arm64-v8a",
  "armeabi-v7a": "aapt2-armeabi-v7a",
  "x86"        : "aapt2-x86",
  "x86_64"     : "aapt2-x86_64"
]
def generatedAapt2JniLibsDir = file("$buildDir/generated/aapt2-jniLibs")

tasks.register("prepareAapt2NativeExecutables") {
  inputs.files(aapt2BinaryByAbi.values().collect { file("src/main/assets/aapt/${it}") })
  outputs.dir(generatedAapt2JniLibsDir)

  doLast {
    delete(generatedAapt2JniLibsDir)

    aapt2BinaryByAbi.each { abi, assetName ->
      def sourceFile = file("src/main/assets/aapt/${assetName}")
      if (!sourceFile.exists()) {
        throw new GradleException("Missing AAPT2 asset for ${abi}: ${sourceFile}")
      }

      def abiDirectory = new File(generatedAapt2JniLibsDir, abi)
      abiDirectory.mkdirs()

      copy {
        from sourceFile
        into abiDirectory
        rename { "libaapt2_exec.so" }
      }
    }
  }
}

android {
    compileSdk = 36

  sourceSets {
    main {
      jniLibs.srcDirs += [generatedAapt2JniLibsDir]
    }
  }

    // Git hash opcional: no debe romper la build cuando se compila una copia sin repo .git (zip/CI sin historial).
    def gitCommitHash = System.getenv("GIT_HASH")?.trim() ?: "unknown"
    def shortCommitHash = System.getenv("GIT_SHORT_HASH")?.trim() ?: gitCommitHash
    if (rootProject.file(".git").exists()) {
        try {
            def fullHead = "git rev-parse HEAD".execute([], rootProject.projectDir)
            def shortHead = "git rev-parse --short HEAD".execute([], rootProject.projectDir)
            fullHead.waitFor()
            shortHead.waitFor()
            if (fullHead.exitValue() == 0) gitCommitHash = fullHead.text.trim()
            if (shortHead.exitValue() == 0) shortCommitHash = shortHead.text.trim()
        } catch (Exception ignored) {
            logger.lifecycle("Aviso: no se pudo leer el hash de git; se usa '${gitCommitHash}'")
        }
    }

    defaultConfig {
        applicationId = "pro.sketchware"
        namespace = "pro.sketchware"
      targetSdk = 35
        minSdk = 26
        versionCode = 176
        versionName = "v7.0.14.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField("String", "GIT_HASH", "\"${gitCommitHash}\"")
        buildConfigField("String", "GIT_SHORT_HASH", "\"${shortCommitHash}\"")

        // Sin la variable de entorno, antes quedaba el literal "null" dentro de BuildConfig.
        def sketchubApiKey = System.getenv("SKETCHUB_API_KEY") ?: ""
        buildConfigField("String", "SKETCHUB_API_KEY", "\"${sketchubApiKey}\"")
    }

    signingConfigs {
        debug {
            storeFile = file("../testkey.keystore")
            storePassword = "testkey"
            keyAlias = "testkey"
            keyPassword = "testkey"
        }
        release {
            // Credenciales fuera del repositorio: variables de entorno o ~/.gradle/gradle.properties.
            def releaseStoreFile = System.getenv("RELEASE_STORE_FILE") ?: project.findProperty("RELEASE_STORE_FILE")
            def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD") ?: project.findProperty("RELEASE_STORE_PASSWORD")
            def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS") ?: project.findProperty("RELEASE_KEY_ALIAS")
            def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD") ?: project.findProperty("RELEASE_KEY_PASSWORD")

            def hasReleaseCredentials = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.toString().isEmpty() }
            if (hasReleaseCredentials) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            } else {
                logger.lifecycle("AVISO: no hay credenciales de release (RELEASE_STORE_FILE/RELEASE_STORE_PASSWORD/RELEASE_KEY_ALIAS/RELEASE_KEY_PASSWORD).")
                logger.lifecycle("AVISO: se firma con ../testkey.keystore, cuyo password es publico. NO publiques esa APK.")
                storeFile = file("../testkey.keystore")
                storePassword = "testkey"
                keyAlias = "testkey"
                keyPassword = "testkey"
            }
        }
    }

    buildTypes {
        release {
            // R8 activado en local. En CI se desactiva con -PskipMinify: el jar de bundletool que
            // descarga GitHub Actions trae classes.dex embebidos junto al bytecode y R8 rechaza ese
            // archive; filtrarlo se lleva por delante aapt2-proto y podria romper los AABs.
            minifyEnabled = !project.hasProperty("skipMinify")
            // shrinkResources se queda en false a proposito: hay 29 usos de getIdentifier() en el
            // editor de propiedades, y el shrink de recursos los borraria. Antes hay que crear
            // app/src/main/res/raw/keep.xml con los recursos referenciados por nombre.
            shrinkResources = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            signingConfig = signingConfigs.release
        }
        debug {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            signingConfig = signingConfigs.debug
        }
    }

    splits {
        // Un APK por ABI: cada dispositivo deja de descargarse las otras arquitecturas.
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
            universalApk false
        }
    }

    packagingOptions {
      jniLibs.useLegacyPackaging = true
      // Ejecutables de Flutter (carril I, Fase 8): `libdartaotruntime.so` y
      // `libfluttergensnapshot.so` son ELF NATIVOS (arm64-v8a y x86_64) que la app EJECUTA desde
      // nativeLibraryDir (SELinux solo permite execve ahi). Se piden sin strip para no tocar los
      // binarios verificados por sha256 (jniLibs/<abi>/, ya stripped en origen).
      jniLibs.keepDebugSymbols.add("**/libdartaotruntime.so")
      jniLibs.keepDebugSymbols.add("**/libfluttergensnapshot.so")
        resources.excludes += "license/*"
        resources.excludes += "META-INF/DEPENDENCIES"
        resources.pickFirsts += "api_database/*"
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    androidResources {
        additionalParameters.addAll("--stable-ids", "${rootDir}/public-stable-ids.txt")
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    lint {
      baseline = file("lint-baseline.xml")
      checkDependencies = true
    }

    configurations.implementation {
        exclude group: 'javax.inject', module: 'javax.inject'
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-compiler-embeddable"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-common"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-jvm"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-script-runtime"
    }
}

// ---------------------------------------------------------------------------
// R8: kotlinc-for-sketchware empaqueta copias de clases de la plataforma
// (dalvik/system/PathClassLoader, DexClassLoader, BaseDexClassLoader, DexPathList).
// R8 falla con "Library class dalvik.system.DelegateLastClassLoader extends
// program class dalvik.system.PathClassLoader" porque android.jar aporta esas
// mismas clases como libreria. Solucion: generar en build/ una copia del jar sin
// dalvik/** y usar esa en lugar del artefacto original.
// ---------------------------------------------------------------------------
// El build local usa un google-services.json mock (tarea createMockGoogleServices), asi que la tarea
// que sube el mapping de R8 a Crashlytics falla con HTTP 400 y no corresponde a un proyecto real.
// Al activar R8 por primera vez esa tarea empieza a tener contenido que subir, asi que la desactivamos.
tasks.matching { it.name.startsWith("uploadCrashlyticsMappingFile") }.configureEach {
    enabled = false
}

// ---------------------------------------------------------------------------
// R8 se atraganta con archives que mezclan contenido DEX y bytecode Java, y tambien con
// jars que reempaquetan clases que Android ya provee:
//   - kotlinc-for-sketchware: dalvik/system/*.class (PathClassLoader, DexClassLoader...)
//   - kxml2:                  org/xmlpull/v1/*.class (los aporta android.jar)
// R8 falla con "Library class X extends/implements program class Y" o con "Cannot create
// android app from an archive containing both DEX and Java-bytecode content". Generamos en
// build/ una copia de cada jar sin esas entradas y sustituimos el artefacto original.
//
// NOTA sobre bundletool: su jar incluye com/android/tools/build/bundletool/archive/dex/**/classes.dex
// (plantillas que usa para construir AABs) junto al bytecode, y GitHub Actions descarga esa version
// CON los dex mientras la cache local los tiene SIN ellos. NO se filtra: excluir el modulo se lleva
// por delante sus dependencias transitivas (aapt2-proto -> com.android.aapt.Resources) y quitarle los
// dex podria romper la generacion de AABs. Por ahora el CI compila con -PskipMinify (sin R8).
// ---------------------------------------------------------------------------
def platformDuplicateJars = [
    [group: "com.github.waelchateur", module: "kotlinc-for-sketchware", version: "2.1.21_rc3", excludes: ["dalvik/**"]],
    [group: "net.sf.kxml", module: "kxml2", version: "2.3.0", excludes: ["org/xmlpull/**"]],
]

def sanitizedJarFiles = files()

platformDuplicateJars.eachWithIndex { spec, index ->
    def cfgName = "platformDuplicateSrc${index}"
    def dupCfg = configurations.create(cfgName)
    // No transitiva: queremos solo el jar de este modulo (bundletool arrastra protobuf y otros).
    dupCfg.transitive = false
    dependencies.add(cfgName, "${spec.group}:${spec.module}:${spec.version}")

    def outName = "${spec.module}-sanitized.jar"
    def taskName = "sanitize" + spec.module.split("-").collect { it.capitalize() }.join("")

    tasks.register(taskName, Jar) {
        archiveFileName = outName
        destinationDirectory = layout.buildDirectory.dir("filtered-libs")
        from({ zipTree(configurations.getByName(cfgName).singleFile) }) {
            spec.excludes.each { pattern -> exclude pattern }
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    def jarFile = files(layout.buildDirectory.file("filtered-libs/${outName}"))
    jarFile.builtBy(taskName)
    sanitizedJarFiles.from(jarFile)

    // El artefacto original se sustituye por el filtrado en las classpaths de la app.
    configurations.matching { it.name.endsWith("CompileClasspath") || it.name.endsWith("RuntimeClasspath") }.all {
        exclude group: spec.group, module: spec.module
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])

    implementation sanitizedJarFiles

    implementation libs.bundles.ui

    implementation libs.bundles.image

    implementation platform(libs.sora.editor)
    implementation libs.bundles.editor.and.lang

    implementation libs.bundles.coil

    implementation libs.bundles.bundletool
    implementation(libs.sdklib) {
        exclude group: "com.intellij", module: "annotations"
    }

    implementation libs.bundles.shrinker
    implementation libs.zipalign.java

    implementation libs.gson
    implementation libs.scpkix.jdk15on

    implementation libs.markwon

    implementation libs.bundles.networking

    // Carril C (Fase 7, soporte Flutter): descompresion XZ de los data.tar.xz de los .deb de
    // Termux sin depender de binarios externos (el parser ar/tar si es propio).
    implementation libs.xz

    implementation libs.ecj
    implementation libs.stax.api

    implementation libs.bundles.kotlin.compiler
    compileOnly libs.kotlin.compiler

    implementation libs.dependencyresolver
    implementation libs.filepicker

    implementation libs.libsu
    implementation libs.insetter
    implementation libs.androidx.security.crypto

    implementation(libs.javaparser.symbol.solver) {
        exclude group: "com.google.guava", module: "guava"
    }

    implementation platform(libs.firebase.bom)
    implementation libs.bundles.firebase

    testImplementation libs.junit4
    androidTestImplementation libs.androidxTestCore
    androidTestImplementation libs.androidxTestExtJunit
    androidTestImplementation libs.androidxTestRunner
    androidTestImplementation libs.androidxTestRules
    androidTestImplementation libs.androidxTestEspressoCore

    coreLibraryDesugaring libs.desugar.jdk.libs.nio
}

tasks.register('createMockGoogleServices') {
